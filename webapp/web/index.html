<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5.0, minimum-scale=0.5">
  <meta name="description" content="IlovePrepa">
  <meta name="theme-color" content="#1B3FA0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IlovePrepa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0c80552a69c54e018793e2bb14fa0bf0"}'></script>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IlovePrepa</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload the brand font so the boot preview renders it directly and the
       text never swaps to the Georgia fallback (which can look like the brand
       changes size). -->
  <link rel="preload" href="assets/assets/fonts/PlayfairDisplay-Variable.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/assets/fonts/Inter-Variable.ttf" as="font" type="font/ttf" crossorigin>

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F4F6FB;
    }

    /* Reuse the app's own bundled fonts so the preview is pixel-identical. */
    @font-face {
      font-family: 'PlayfairDisplay';
      font-display: swap;
      src: url('assets/assets/fonts/PlayfairDisplay-Variable.ttf') format('truetype');
    }
    @font-face {
      font-family: 'Inter';
      font-display: swap;
      src: url('assets/assets/fonts/Inter-Variable.ttf') format('truetype');
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    }

    /* Static first paint — brand on mid-blue, shown until Flutter's first
       frame. No spinner, no artificial delay. */
    #boot-preview {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: #1B3FA0;
      transition: opacity 0.25s ease;
    }
    #boot-preview.boot-hide {
      opacity: 0;
      pointer-events: none;
    }

    .boot-splash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-brand {
      font-family: 'PlayfairDisplay', Georgia, serif;
      font-size: 40px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .boot-brand .heart {
      color: #F44336;
      font-size: 36px;
    }
  </style>
</head>
<body>
  <div id="boot-preview" aria-hidden="true">
    <div class="boot-splash">
      <div class="boot-brand">I<span class="heart">♥</span>Prepa</div>
    </div>
  </div>
  <script>
    // Keep the splash up until Flutter signals that the library data is loaded
    // and rendered (its "iloveprepa-data-ready" DOM event), so the sidebar
    // text/icons are already on screen the moment it fades — never a blank
    // flash first. A fallback timer guarantees the splash can never trap the
    // page even if the app never reports in.
    (function () {
      function hidePreview() {
        var el = document.getElementById('boot-preview');
        if (el && !el.classList.contains('boot-hide')) {
          el.classList.add('boot-hide');
          setTimeout(function () { el.remove(); }, 300);
        }
      }
      window.addEventListener('iloveprepa-data-ready', hidePreview, { once: true });
      document.addEventListener('iloveprepa-data-ready', hidePreview, { once: true });
      setTimeout(hidePreview, 20000);
    })();
  </script>
  <!--
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
