    #boot-preview {

  <script>
    // One rule: the user must never wait. The text above paints the moment
    // this HTML arrives (a few KB, system fonts). The Flutter Wasm app
    // downloads in the background and the second it paints its own first
    // frame — where it already shows a loading skeleton — this preview fades.
    (function () {
      function hidePreview() {
        var el = document.getElementById('boot-preview');
        if (el && !el.classList.contains('boot-hide')) {
          el.classList.add('boot-hide');
          setTimeout(function () { el.remove(); }, 300);
        }
      }
      // Whichever comes first wins: content fully loaded (data-ready), first
      // Flutter frame, or a hard timeout. Nothing can leave the user stuck.
      window.addEventListener('iloveprepa-data-ready', hidePreview, { once: true });
      document.addEventListener('iloveprepa-data-ready', hidePreview, { once: true });

      function onFirstFrame() {
        var view = document.querySelector('flutter-view');
        if (!view) return false;
        // Wait two animation frames so the engine has actually painted before
        // we reveal it.
        requestAnimationFrame(function () {
          requestAnimationFrame(hidePreview);
        });
        return true;
      }
      if (!onFirstFrame()) {
        var obs = new MutationObserver(function () {
          if (onFirstFrame()) obs.disconnect();
        });
        obs.observe(document.body, { childList: true, subtree: true });
      }
      setTimeout(hidePreview, 4000);
    })();
  </script>
  <!--
