<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes, maximum-scale=5.0, minimum-scale=0.5">
  <meta name="description" content="Tous les documents de prépa tunisienne : cours, TD, DS, examens et exercices corrigés pour toutes les filières (MP, PC, PT, T). Gratuits, sans inscription, en PDF.">
  <meta name="theme-color" content="#1B3FA0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IlovePrepa">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Cloudflare Web Analytics -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "0c80552a69c54e018793e2bb14fa0bf0"}'></script>

  <!-- Favicon (brand logo, regenerated from assets/logo.png) -->
  <link rel="shortcut icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=5">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">

  <title>IlovePrepa | 2000+ documents de prépa gratuits en Tunisie</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload what the first page (the blue I♥Prepa splash) needs to render
       at once, even on the very first visit: the browser/tab icon and the
       home-screen icon (both fetched exactly once, verified in the net log).
       The brand font PlayfairDisplay is deliberately NOT preloaded: a font
       preload is fetched AGAIN by the style/FontManifest (2x instead of 1x,
       ~400 KB wasted) — measured, net loss. It uses font-display:swap below
       and paints in the real font right after the wasm. -->
  <link rel="preload" as="image" href="favicon.png?v=5">
  <link rel="preload" as="image" href="apple-touch-icon.png">

  <!-- Warm the connections a fast opening needs before they are actually
       used, the same resource-hint technique mcmaster.com uses: the API that
       serves the document list (DNS + TLS happen while the app binary
       downloads) and the analytics beacon. -->
  <link rel="dns-prefetch" href="https://iloveprepa-r2.ilovepreparatoire.workers.dev">
  <link rel="preconnect" href="https://iloveprepa-r2.ilovepreparatoire.workers.dev" crossorigin>
  <link rel="dns-prefetch" href="https://static.cloudflareinsights.com">

  <!-- Start the boot's heavy downloads in parallel the moment this (tiny) text
       page arrives, without ever downloading anything twice:
         * main.dart.mjs and canvaskit/skwasm.js are fetched via dynamic
           import(), so modulepreload warms them through the module map and
           Chrome reuses the download later (no double fetch — a raw
           <link rel="preload"> on the wasm files is fetched AGAIN by
           Flutter's loader, wasting bandwidth).
         * The engine is served same-origin (built locally, see deploy.bat) so
           there is no gstatic CDN round-trip.
       flutter_bootstrap.js picks main.dart.wasm on WasmGC browsers and falls
       back to main.dart.js elsewhere. -->
  <link rel="modulepreload" href="main.dart.mjs">
  <link rel="modulepreload" href="canvaskit/skwasm.js">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #F4F6FB;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
      color: #1C2340;
    }

    /* The same blue I♥Prepa splash as always on first open — white brand
       text on #1B3FA0, red heart — but it paints instantly and yields the
       screen the moment Flutter draws, so the user never waits. No spinner,
       no loading tile, no extra text. */
    #boot-preview {
      position: fixed;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      background: #1B3FA0;
      transition: opacity 0.25s ease;
    }
    #boot-preview.boot-hide {
      opacity: 0;
      pointer-events: none;
    }

    <!-- Reuse the app's brand font so the splash is pixel-identical. font-display
       swap shows Georgia for the instant the font takes to arrive — a font
       preload would cost a second download (measured double fetch), so it
       must never compete with the Wasm binary download. -->
    @font-face {
      font-family: 'PlayfairDisplay';
      font-display: swap;
      src: url('assets/assets/fonts/PlayfairDisplay-Variable.ttf') format('truetype');
    }

    .boot-splash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .boot-brand {
      font-family: 'PlayfairDisplay', Georgia, serif;
      font-size: 40px;
      font-weight: 700;
      color: #FFFFFF;
    }
    .boot-brand .heart {
      color: #F44336;
      font-size: 36px;
    }
  </style>
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iprepa">
  <meta property="og:title" content="IlovePrepa | 2000+ documents de prépa gratuits en Tunisie">
  <meta property="og:description" content="Cours, TD, DS, examens et exercices corrigés de toutes les filières (MP, PC, PT, T). Gratuits, sans inscription, en PDF.">
  <meta property="og:image" content="https://iprepa.tn/icons/Icon-512.png">
  <meta property="og:locale" content="fr_TN">
  <meta property="og:url" content="https://iprepa.tn/">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "iprepa",
    "alternateName": "IlovePrepa",
    "url": "https://iprepa.tn/",
    "about": "Documents et révisions de classes préparatoires tunisiennes"
  }
  </script>
</head>
<body>
  <div id="boot-preview" aria-hidden="true">
    <div class="boot-splash">
      <div class="boot-brand">I<span class="heart">♥</span>Prepa</div>
    </div>
  </div>
  <script>
    // One rule: the user must never see a white nothing. The blue I♥Prepa
    // splash paints the moment this HTML arrives (a few KB). It fades only
    // when the app itself reports that something is on screen:
    //   - "iloveprepa-first-frame": Flutter painted its first frame (it shows
    //     its own loading skeleton while the documents arrive),
    //   - "iloveprepa-data-ready": the library is fully loaded and rendered.
    // A long safety timer covers a completely failed load so nothing can
    // trap the page — but it must never beat Flutter's first frame, or a
    // white flash would appear between the splash and the app.
    (function () {
      function hidePreview() {
        var el = document.getElementById('boot-preview');
        if (el && !el.classList.contains('boot-hide')) {
          el.classList.add('boot-hide');
          setTimeout(function () { el.remove(); }, 300);
        }
      }
      ['iloveprepa-first-frame', 'iloveprepa-data-ready'].forEach(function (name) {
        window.addEventListener(name, hidePreview, { once: true });
        document.addEventListener(name, hidePreview, { once: true });
      });
      setTimeout(hidePreview, 10000);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
